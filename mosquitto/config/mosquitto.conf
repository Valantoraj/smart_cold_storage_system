# Mosquitto MQTT Broker Configuration
# Smart Cold Storage Digital Twin System

# =============================================================================
# General Configuration
# =============================================================================

# Run in background (not applicable in Docker)
# daemon false

# Process ID file
pid_file /var/run/mosquitto/mosquitto.pid

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# =============================================================================
# Default Listener - MQTT Protocol
# =============================================================================

# MQTT listener on port 1883
listener 1883
protocol mqtt

# Allow anonymous connections (for development)
# For production, set to false and configure authentication
allow_anonymous true

# Maximum number of client connections
max_connections -1

# =============================================================================
# WebSocket Listener (Optional)
# =============================================================================

# WebSocket listener on port 9001
listener 9001
protocol websockets

# =============================================================================
# Security Configuration
# =============================================================================

# Password file (uncomment for authentication)
# password_file /mosquitto/config/passwd

# ACL file for topic access control (uncomment for authorization)
# acl_file /mosquitto/config/acl

# =============================================================================
# Message Configuration
# =============================================================================

# Maximum packet size (100MB)
message_size_limit 104857600

# QoS settings
max_qos 2

# Retain messages
retain_available true
max_retained_messages -1

# =============================================================================
# Queue Configuration
# =============================================================================

# Maximum queued messages per client
max_queued_messages 1000

# Queue QoS 0 messages
queue_qos0_messages false

# =============================================================================
# Performance Tuning
# =============================================================================

# Maximum inflight messages
max_inflight_messages 20

# Autosave interval (seconds)
autosave_interval 1800

# =============================================================================
# System Resource Limits
# =============================================================================

# Maximum number of queued bytes
max_queued_bytes 0

# Persistent client expiration
persistent_client_expiration 30d

# =============================================================================
# Bridge Configuration (Optional - for multi-site deployments)
# =============================================================================

# Uncomment and configure for MQTT bridging
# connection bridge-01
# address remote-broker.example.com:1883
# topic coldstorage/# both 0

# =============================================================================
# Plugin Configuration (Optional)
# =============================================================================

# Auth plugin (if needed)
# auth_plugin /path/to/auth-plugin.so

# =============================================================================
# Connection Options
# =============================================================================

# Keepalive
# Client will disconnect if no activity for this period
max_keepalive 65535

# Connection messages
connection_messages true

# =============================================================================
# Topic Configuration for Cold Storage
# =============================================================================

# Expected topic structure:
# coldstorage/CS-01/data
# coldstorage/CS-02/data
# coldstorage/CS-03/data
# coldstorage/+/alerts
# coldstorage/+/commands
# coldstorage/+/status

# Clients can subscribe to:
# coldstorage/# - all topics
# coldstorage/+/data - all data topics
# coldstorage/CS-01/# - all topics for unit CS-01
