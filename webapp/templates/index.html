<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Cold Storage · Control Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══ Aura-X Light Theme ═══ */
:root {
  --bg:          #f0f4f8;
  --bg-2:        #ffffff;
  --bg-card:     #ffffff;
  --bg-hover:    #f7fafc;
  --bg-accent:   #eff6ff;
  --border:      #e2e8f0;
  --border-hi:   #93c5fd;
  --text:        #1a202c;
  --text-2:      #4a5568;
  --text-muted:  #a0aec0;
  --accent:      #2563eb;
  --accent-glow: rgba(37,99,235,0.12);
  --success:     #059669;
  --success-bg:  rgba(5,150,105,0.08);
  --warning:     #d97706;
  --warning-bg:  rgba(217,119,6,0.08);
  --danger:      #dc2626;
  --danger-bg:   rgba(220,38,38,0.08);
  --purple:      #7c3aed;
  --purple-bg:   rgba(124,58,237,0.08);
  --cyan:        #0891b2;
  --cyan-bg:     rgba(8,145,178,0.08);
  --radius:      12px;
  --radius-sm:   8px;
  --shadow-sm:   0 1px 2px rgba(0,0,0,0.04);
  --shadow:      0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-lg:   0 10px 25px rgba(0,0,0,0.06), 0 4px 10px rgba(0,0,0,0.04);
  --font-sans:   'Inter', system-ui, sans-serif;
  --font-mono:   'JetBrains Mono', 'Cascadia Code', monospace;
}
* { margin:0; padding:0; box-sizing:border-box; scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
*::-webkit-scrollbar { width:5px; height:5px; }
*::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
body { background:var(--bg); color:var(--text); font-family:var(--font-sans); min-height:100vh; overflow-x:hidden; }

/* ═══ Header ═══ */
.header {
  background:var(--bg-2); border-bottom:1px solid var(--border);
  padding:14px 28px; display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:100; box-shadow:var(--shadow-sm);
}
.header-left { display:flex; align-items:center; gap:14px; }
.logo {
  width:36px; height:36px; border-radius:10px;
  background:linear-gradient(135deg, var(--accent), var(--cyan));
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 2px 8px var(--accent-glow);
}
.logo svg { width:20px; height:20px; fill:#fff; }
.brand { font-size:18px; font-weight:800; letter-spacing:-0.02em; }
.gradient-text { background:linear-gradient(135deg, #2563eb, #0891b2, #7c3aed); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.version-badge {
  font-family:var(--font-mono); font-size:10px; font-weight:600;
  padding:2px 8px; border-radius:6px; background:var(--bg-card);
  color:var(--text-muted); border:1px solid var(--border);
}
.header-right { display:flex; align-items:center; gap:20px; }
.status-pill { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; }
.dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
.dot-live { background:var(--success); box-shadow:0 0 6px 1px rgba(5,150,105,0.4); animation:dotPulse 2s infinite; }
.dot-warn { background:var(--warning); box-shadow:0 0 6px 1px rgba(217,119,6,0.4); animation:dotPulse 1.5s infinite; }
.dot-off  { background:var(--text-muted); }
@keyframes dotPulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

/* ═══ Control Bar ═══ */
.control-bar {
  background:var(--bg-2); border-bottom:1px solid var(--border);
  padding:10px 28px; display:flex; align-items:center; justify-content:space-between;
}
.control-left { display:flex; align-items:center; gap:12px; }
.btn {
  display:inline-flex; align-items:center; gap:6px; padding:8px 16px;
  border-radius:var(--radius-sm); font-size:13px; font-weight:600;
  cursor:pointer; border:1px solid var(--border); background:var(--bg-card);
  color:var(--text-2); transition:all 0.15s; white-space:nowrap;
}
.btn:hover { background:var(--bg-hover); color:var(--text); border-color:var(--border-hi); }
.btn:active { transform:scale(0.97); }
.btn-primary { background:var(--accent); border-color:var(--accent); color:#fff; }
.btn-primary:hover { opacity:0.9; }
.btn-success { background:var(--success); border-color:var(--success); color:#fff; }
.btn-success:hover { opacity:0.9; }
.btn-danger { background:var(--danger); border-color:var(--danger); color:#fff; }
.btn-danger:hover { opacity:0.9; }
.btn-sm { padding:5px 11px; font-size:11px; }
.control-right { display:flex; align-items:center; gap:16px; font-size:12px; color:var(--text-2); }
.stat-mini { font-family:var(--font-mono); font-weight:600; color:var(--text); }
.speed-select { display:flex; gap:2px; background:var(--bg-hover); border-radius:var(--radius-sm); padding:2px; }
.speed-btn { padding:4px 10px; border:none; background:none; font-size:11px; font-weight:600; color:var(--text-muted); border-radius:6px; cursor:pointer; }
.speed-btn.active { background:var(--bg-card); color:var(--accent); box-shadow:var(--shadow-sm); }

/* ═══ Main Grid ═══ */
.main { padding:24px 28px; max-width:1600px; margin:0 auto; }
.units-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }

/* ═══ Unit Card ═══ */
.unit-card {
  background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius);
  padding:20px; box-shadow:var(--shadow); transition:border-color 0.2s, box-shadow 0.2s;
  position:relative; overflow:hidden;
}
.unit-card:hover { border-color:var(--border-hi); box-shadow:var(--shadow-lg); }
.unit-card.critical { border-color:var(--danger); animation:criticalPulse 3s infinite; }
.unit-card.warning { border-color:var(--warning); }
@keyframes criticalPulse { 0%,100%{box-shadow:0 0 0 0 var(--danger-bg)} 50%{box-shadow:0 0 12px 0 var(--danger-bg)} }

.unit-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.unit-id { display:flex; align-items:center; gap:8px; }
.unit-id-badge { font-family:var(--font-mono); font-size:14px; font-weight:700; color:var(--accent); }
.unit-loc { font-size:11px; color:var(--text-muted); font-weight:500; }
.health-badge {
  display:inline-flex; align-items:center; gap:5px; padding:4px 10px;
  border-radius:20px; font-size:11px; font-weight:600; letter-spacing:0.03em;
}
.health-healthy { background:var(--success-bg); color:var(--success); }
.health-warning { background:var(--warning-bg); color:var(--warning); }
.health-critical { background:var(--danger-bg); color:var(--danger); }

/* ═══ Gauge ═══ */
.gauge-wrap { display:flex; justify-content:center; margin:8px 0; }
.gauge { position:relative; width:140px; height:140px; }
.gauge svg { transform:rotate(-90deg); }
.gauge-bg { stroke:var(--border); }
.gauge-fill { stroke-linecap:round; transition:stroke-dashoffset 0.5s ease, stroke 0.3s; }
.gauge-center { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; }
.gauge-val { font-family:var(--font-mono); font-size:28px; font-weight:700; line-height:1; }
.gauge-unit { font-size:11px; color:var(--text-muted); font-weight:600; margin-top:2px; }

/* ═══ Metric Row ═══ */
.metrics-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:18px; }
.metric {
  background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:10px 12px; text-align:center;
}
.metric-label { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-muted); margin-bottom:4px; }
.metric-val { font-family:var(--font-mono); font-size:18px; font-weight:700; line-height:1; }
.metric-sub { font-size:10px; color:var(--text-muted); margin-top:2px; }

/* Compressor icon */
.comp-icon { display:inline-flex; align-items:center; justify-content:center; }
.comp-icon.on svg { animation:spin 1.2s linear infinite; color:var(--success); }
.comp-icon.off svg { color:var(--text-muted); }
@keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }

/* Humidity bar */
.bar-wrap { width:100%; height:6px; background:var(--border); border-radius:3px; overflow:hidden; margin-top:4px; }
.bar-fill { height:100%; border-radius:3px; transition:width 0.4s, background 0.3s; }

/* Energy bar */
.energy-bar { background:linear-gradient(90deg, var(--success), var(--warning), var(--danger)); }

/* ═══ Sparkline ═══ */
.sparkline-wrap { margin-top:14px; height:32px; }
.sparkline { width:100%; height:100%; }
.sparkline-label { font-size:10px; color:var(--text-muted); font-weight:600; margin-bottom:2px; }

/* ═══ Scenario Buttons ═══ */
.scenario-section { margin-top:16px; border-top:1px solid var(--border); padding-top:14px; }
.scenario-title { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-muted); margin-bottom:8px; }
.scenario-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.scenario-btn {
  padding:7px 4px; border-radius:6px; font-size:10px; font-weight:600;
  border:1px solid var(--border); background:var(--bg); color:var(--text-2);
  cursor:pointer; transition:all 0.15s; text-align:center; line-height:1.2;
  display:flex; flex-direction:column; align-items:center; gap:3px;
}
.scenario-btn:hover { border-color:var(--border-hi); background:var(--bg-hover); }
.scenario-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 2px 8px var(--accent-glow); }
.scenario-btn .sb-icon { font-size:14px; }

/* ═══ Alert Feed ═══ */
.alert-section { margin-top:24px; }
.section-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.section-title { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-muted); }
.alert-feed { display:flex; flex-direction:column; gap:8px; max-height:300px; overflow-y:auto; }
.alert-item {
  display:flex; align-items:flex-start; gap:12px; padding:10px 14px;
  background:var(--bg-card); border:1px solid var(--border); border-left:3px solid;
  border-radius:0 var(--radius-sm) var(--radius-sm) 0; box-shadow:var(--shadow-sm);
  animation:slideUp 0.25s ease-out;
}
@keyframes slideUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.alert-critical { border-left-color:var(--danger); }
.alert-warning { border-left-color:var(--warning); }
.alert-icon { font-size:16px; flex-shrink:0; margin-top:1px; }
.alert-body { flex:1; }
.alert-msg { font-size:13px; font-weight:600; }
.alert-meta { font-size:11px; color:var(--text-muted); margin-top:2px; font-family:var(--font-mono); }
.alert-sev { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; padding:1px 6px; border-radius:4px; }
.alert-sev-critical { background:var(--danger-bg); color:var(--danger); }
.alert-sev-warning { background:var(--warning-bg); color:var(--warning); }

/* ═══ Toast ═══ */
.toast-wrap { position:fixed; bottom:24px; right:24px; z-index:200; display:flex; flex-direction:column; gap:8px; }
.toast {
  background:var(--bg-card); border:1px solid var(--border); border-left:3px solid;
  border-radius:var(--radius-sm); padding:12px 16px; box-shadow:var(--shadow-lg);
  min-width:280px; max-width:380px; animation:toastIn 0.3s ease-out;
}
@keyframes toastIn { from{opacity:0;transform:translateX(40px)} to{opacity:1;transform:translateX(0)} }
.toast.critical { border-left-color:var(--danger); }
.toast.warning { border-left-color:var(--warning); }
.toast-title { font-size:12px; font-weight:700; display:flex; align-items:center; gap:6px; }
.toast-msg { font-size:12px; color:var(--text-2); margin-top:3px; }
.toast-time { font-size:10px; color:var(--text-muted); margin-top:4px; font-family:var(--font-mono); }

/* ═══ Responsive ═══ */
@media (max-width:1100px) { .units-grid { grid-template-columns:1fr 1fr; } }
@media (max-width:720px) { .units-grid { grid-template-columns:1fr; } .control-bar { flex-direction:column; gap:10px; } }
</style>
</head>
<body>

<!-- ═══ Header ═══ -->
<div class="header">
  <div class="header-left">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M12 2L3 7v10l9 5 9-5V7l-9-5zm0 2.2l6.5 3.6-6.5 3.6L5.5 8 12 4.2zM5 9.2l6 3.3v7.3l-6-3.3V9.2zm14 0v7.3l-6 3.3v-7.3l6-3.3z"/></svg>
    </div>
    <span class="brand gradient-text">Smart Cold Storage</span>
    <span class="version-badge">DIGITAL TWIN v1.0</span>
  </div>
  <div class="header-right">
    <span class="status-pill"><span id="mqttDot" class="dot dot-off"></span><span id="mqttText" style="color:var(--text-muted)">MQTT Offline</span></span>
    <span class="status-pill"><span id="simDot" class="dot dot-live"></span><span id="simText" style="color:var(--success)">Running</span></span>
  </div>
</div>

<!-- ═══ Control Bar ═══ -->
<div class="control-bar">
  <div class="control-left">
    <button class="btn btn-primary" id="btnStart" onclick="sendControl('start')">▶ Start</button>
    <button class="btn btn-danger" id="btnStop" onclick="sendControl('stop')">⏹ Stop</button>
    <div class="speed-select">
      <button class="speed-btn active" data-speed="1" onclick="sendSpeed(1)">1×</button>
      <button class="speed-btn" data-speed="2" onclick="sendSpeed(2)">2×</button>
      <button class="speed-btn" data-speed="5" onclick="sendSpeed(5)">5×</button>
      <button class="speed-btn" data-speed="10" onclick="sendSpeed(10)">10×</button>
    </div>
  </div>
  <div class="control-right">
    <span>Messages: <span class="stat-mini" id="statMsgs">0</span></span>
    <span>Alerts: <span class="stat-mini" id="statAlerts">0</span></span>
    <span>Uptime: <span class="stat-mini" id="statUptime">00:00</span></span>
  </div>
</div>

<!-- ═══ Main ═══ -->
<div class="main">
  <div class="units-grid" id="unitsGrid">
    <!-- Unit cards injected by JS -->
  </div>

  <!-- Alert Feed -->
  <div class="alert-section">
    <div class="section-head">
      <span class="section-title">⚡ Live Alert Feed</span>
      <span style="font-size:11px;color:var(--text-muted)" id="alertCount">0 alerts</span>
    </div>
    <div class="alert-feed" id="alertFeed">
      <div style="text-align:center;color:var(--text-muted);font-size:13px;padding:20px" id="noAlerts">No alerts — all units operating normally</div>
    </div>
  </div>
</div>

<!-- Toast container -->
<div class="toast-wrap" id="toastWrap"></div>

<!-- ═══ Socket.IO + Logic ═══ -->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
const socket = io();

let state = {
  running: true,
  speed: 1,
  mqttConnected: false,
  stats: { messages_sent: 0, alerts_triggered: 0, start_time: Date.now()/1000 },
  units: {},
  alerts: [],
  scenarios: [],
};

// ─── Gauge color by temp ───
function tempColor(t) {
  if (t >= 10) return getCSS('--danger');
  if (t >= 8) return getCSS('--warning');
  if (t >= 6) return getCSS('--warning');
  return getCSS('--success');
}
function healthColor(h) {
  return h === 'critical' ? '--danger' : h === 'warning' ? '--warning' : '--success';
}
function getCSS(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

// ─── Build unit cards ───
function buildCards() {
  const grid = document.getElementById('unitsGrid');
  grid.innerHTML = '';
  for (const [id, u] of Object.entries(state.units)) {
    const card = document.createElement('div');
    card.className = 'unit-card ' + u.healthStatus;
    card.id = 'card-' + id;

    // Scenario buttons
    let scenBtns = '';
    for (const s of state.scenarios) {
      const active = (s.id === u.scenario) ? 'active' : '';
      scenBtns += `<button class="scenario-btn ${active}" data-unit="${id}" data-scen="${s.id}" onclick="setScenario('${id}','${s.id}')">
        <span class="sb-icon">${scenarioIcon(s.id)}</span>${s.label}</button>`;
    }

    card.innerHTML = `
      <div class="unit-header">
        <div class="unit-id">
          <span class="unit-id-badge">${id}</span>
          <span class="unit-loc">${u.location || ''}</span>
        </div>
        <span class="health-badge health-${u.healthStatus}">
          <span class="dot ${u.healthStatus==='healthy'?'dot-live':u.healthStatus==='warning'?'dot-warn':'dot-off'}"></span>
          ${u.healthStatus}
        </span>
      </div>

      <div class="gauge-wrap">
        <div class="gauge">
          <svg width="140" height="140" viewBox="0 0 140 140">
            <circle cx="70" cy="70" r="56" fill="none" stroke-width="8" class="gauge-bg" />
            <circle id="gauge-${id}" cx="70" cy="70" r="56" fill="none" stroke-width="8"
              class="gauge-fill" stroke="${tempColor(u.temperature)}"
              stroke-dasharray="351.86" stroke-dashoffset="${351.86 - (351.86 * Math.min(Math.abs(u.temperature)/15, 1))}" />
          </svg>
          <div class="gauge-center">
            <div class="gauge-val" id="tempVal-${id}" style="color:${tempColor(u.temperature)}">${u.temperature}°</div>
            <div class="gauge-unit">Temperature</div>
          </div>
        </div>
      </div>

      <div class="metrics-row">
        <div class="metric">
          <div class="metric-label">Humidity</div>
          <div class="metric-val" id="humVal-${id}" style="color:var(--cyan)">${u.humidity}%</div>
          <div class="bar-wrap"><div class="bar-fill" id="humBar-${id}" style="width:${u.humidity}%;background:var(--cyan)"></div></div>
        </div>
        <div class="metric">
          <div class="metric-label">Compressor</div>
          <div class="comp-icon ${u.compressorStatus==='ON'?'on':'off'}" id="comp-${id}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/>
              <path d="M12 1v6m0 10v6M4.22 4.22l4.24 4.24m7.08 7.08l4.24 4.24M1 12h6m10 0h6M4.22 19.78l4.24-4.24m7.08-7.08l4.24-4.24"/>
            </svg>
          </div>
          <div class="metric-sub" id="compSub-${id}" style="color:${u.compressorStatus==='ON'?'var(--success)':'var(--text-muted)'}">${u.compressorStatus} · ${u.compressorCycles||0} cycles</div>
        </div>
        <div class="metric">
          <div class="metric-label">Energy</div>
          <div class="metric-val" id="energyVal-${id}" style="color:${(u.energyConsumption||0)>=4?'var(--danger)':(u.energyConsumption||0)>=3?'var(--warning)':'var(--success)'}">${u.energyConsumption}kW</div>
          <div class="bar-wrap"><div class="bar-fill energy-bar" id="energyBar-${id}" style="width:${Math.min((u.energyConsumption||0)/5*100, 100)}%"></div></div>
        </div>
      </div>

      <div class="sparkline-wrap">
        <div class="sparkline-label">Temperature (last 30 readings)</div>
        <svg class="sparkline" id="spark-${id}" viewBox="0 0 100 32" preserveAspectRatio="none"></svg>
      </div>

      <div class="scenario-section">
        <div class="scenario-title">⚠ Trigger Condition</div>
        <div class="scenario-grid">${scenBtns}</div>
      </div>
    `;
    grid.appendChild(card);
  }
  drawAllSparklines();
}

function scenarioIcon(id) {
  const icons = {
    normal:'✓', temp_rising:'↗', temp_fluctuating:'〰', high_energy:'⚡',
    humidity_issue:'💧', equipment_degradation:'⚙', door_open:'🚪', compressor_failure:'⏻'
  };
  return icons[id] || '•';
}

// ─── Update a unit card on new reading ───
function updateUnit(d) {
  const id = d.unitId;
  state.units[id] = { ...state.units[id], ...d };

  // Gauge
  const gauge = document.getElementById('gauge-'+id);
  const tempVal = document.getElementById('tempVal-'+id);
  if (gauge) {
    const pct = Math.min(Math.abs(d.temperature)/15, 1);
    const color = tempColor(d.temperature);
    gauge.style.stroke = color;
    gauge.style.strokeDashoffset = 351.86 - (351.86 * pct);
    tempVal.textContent = d.temperature + '°';
    tempVal.style.color = color;
  }

  // Humidity
  const humVal = document.getElementById('humVal-'+id);
  const humBar = document.getElementById('humBar-'+id);
  if (humVal) { humVal.textContent = d.humidity + '%'; humBar.style.width = d.humidity + '%'; }

  // Compressor
  const comp = document.getElementById('comp-'+id);
  const compSub = document.getElementById('compSub-'+id);
  if (comp) {
    comp.className = 'comp-icon ' + (d.compressorStatus === 'ON' ? 'on' : 'off');
    compSub.textContent = d.compressorStatus + ' · ' + (d.compressorCycles||0) + ' cycles';
    compSub.style.color = d.compressorStatus === 'ON' ? 'var(--success)' : 'var(--text-muted)';
  }

  // Energy
  const enVal = document.getElementById('energyVal-'+id);
  const enBar = document.getElementById('energyBar-'+id);
  if (enVal) {
    enVal.textContent = d.energyConsumption + 'kW';
    enVal.style.color = d.energyConsumption>=4 ? 'var(--danger)' : d.energyConsumption>=3 ? 'var(--warning)' : 'var(--success)';
    enBar.style.width = Math.min(d.energyConsumption/5*100, 100) + '%';
  }

  // Health badge
  const card = document.getElementById('card-'+id);
  if (card) {
    card.className = 'unit-card ' + d.healthStatus;
    const badge = card.querySelector('.health-badge');
    if (badge) {
      badge.className = 'health-badge health-' + d.healthStatus;
      badge.innerHTML = `<span class="dot ${d.healthStatus==='healthy'?'dot-live':d.healthStatus==='warning'?'dot-warn':'dot-off'}"></span> ${d.healthStatus}`;
    }
  }

  // Sparkline
  if (d.history) drawSparkline(id, d.history);
}

// ─── Sparkline drawing ───
function drawSparkline(unitId, history) {
  const svg = document.getElementById('spark-'+unitId);
  if (!svg || !history || history.length < 2) return;
  const temps = history.map(h => h.temp);
  const min = Math.min(...temps, 0), max = Math.max(...temps, 15);
  const range = max - min || 1;
  const pts = temps.map((t, i) => {
    const x = (i / (temps.length - 1)) * 100;
    const y = 32 - ((t - min) / range) * 28 - 2;
    return `${x},${y}`;
  });
  const lastT = temps[temps.length-1];
  const color = tempColor(lastT);
  svg.innerHTML = `
    <polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="0,32 100,32" fill="none" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="2,2"/>
  `;
}
function drawAllSparklines() {
  for (const [id, u] of Object.entries(state.units)) {
    if (u.history) drawSparkline(id, u.history);
  }
}

// ─── Alert feed ───
function addAlert(a) {
  if (!state.alerts.find(x => x.unitId === a.unitId && x.alertType === a.alertType && x.timestamp === a.timestamp)) {
    state.alerts.unshift(a);
    if (state.alerts.length > 20) state.alerts.pop();
  }
  renderAlerts();
  showToast(a);
}
function renderAlerts() {
  const feed = document.getElementById('alertFeed');
  const count = document.getElementById('alertCount');
  count.textContent = state.alerts.length + ' alert' + (state.alerts.length !== 1 ? 's' : '');
  if (state.alerts.length === 0) {
    feed.innerHTML = '<div style="text-align:center;color:var(--text-muted);font-size:13px;padding:20px">No alerts — all units operating normally</div>';
    return;
  }
  feed.innerHTML = state.alerts.map(a => `
    <div class="alert-item alert-${a.severity}">
      <span class="alert-icon">${a.severity === 'critical' ? '🔴' : '🟡'}</span>
      <div class="alert-body">
        <div class="alert-msg">${a.message}</div>
        <div class="alert-meta">${a.unitId} · ${a.scenario} · ${new Date(a.timestamp).toLocaleTimeString()}</div>
      </div>
      <span class="alert-sev alert-sev-${a.severity}">${a.severity}</span>
    </div>
  `).join('');
}

// ─── Toast ───
function showToast(a) {
  const wrap = document.getElementById('toastWrap');
  const toast = document.createElement('div');
  toast.className = 'toast ' + a.severity;
  toast.innerHTML = `
    <div class="toast-title">${a.severity === 'critical' ? '🔴' : '🟡'} ${a.unitId}: ${a.alertType.replace(/_/g, ' ').toUpperCase()}</div>
    <div class="toast-msg">${a.message}</div>
    <div class="toast-time">${new Date(a.timestamp).toLocaleString()}</div>
  `;
  wrap.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateX(40px)'; toast.style.transition = 'all 0.3s'; setTimeout(() => toast.remove(), 300); }, 5000);
}

// ─── Stats ───
function updateStats() {
  document.getElementById('statMsgs').textContent = state.stats.messages_sent || 0;
  document.getElementById('statAlerts').textContent = state.stats.alerts_triggered || 0;
  const uptime = Math.floor(Date.now()/1000 - (state.stats.start_time || Date.now()/1000));
  const h = String(Math.floor(uptime/3600)).padStart(2,'0');
  const m = String(Math.floor((uptime%3600)/60)).padStart(2,'0');
  const s = String(uptime%60).padStart(2,'0');
  document.getElementById('statUptime').textContent = h + ':' + m + ':' + s;
}
setInterval(updateStats, 1000);

// ─── Scenario buttons ───
function setScenario(unitId, scenario) {
  socket.emit('set_scenario', { unitId, scenario });
}
// Highlight active
function updateScenarioButtons(unitId, scenario) {
  const card = document.getElementById('card-'+unitId);
  if (!card) return;
  card.querySelectorAll('.scenario-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.scen === scenario);
  });
}

// ─── Controls ───
function sendControl(action) {
  socket.emit('control', { action });
  if (action === 'start') { state.running = true; updateSimStatus(); }
  if (action === 'stop') { state.running = false; updateSimStatus(); }
}
function sendSpeed(s) {
  socket.emit('control', { action: 'speed', speed: s });
  state.speed = s;
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.toggle('active', parseFloat(b.dataset.speed) === s));
}
function updateSimStatus() {
  const dot = document.getElementById('simDot');
  const txt = document.getElementById('simText');
  if (state.running) { dot.className = 'dot dot-live'; txt.textContent = 'Running'; txt.style.color = 'var(--success)'; }
  else { dot.className = 'dot dot-off'; txt.textContent = 'Paused'; txt.style.color = 'var(--text-muted)'; }
}

// ─── Socket events ───
socket.on('init', (d) => {
  state = { ...state, ...d };
  buildCards();
  renderAlerts();
  updateSimStatus();
  updateStats();
  // MQTT indicator
  const md = document.getElementById('mqttDot'), mt = document.getElementById('mqttText');
  if (d.mqttConnected) { md.className = 'dot dot-live'; mt.textContent = 'MQTT Connected'; mt.style.color = 'var(--success)'; }
  else { md.className = 'dot dot-off'; mt.textContent = 'MQTT Offline'; mt.style.color = 'var(--text-muted)'; }
  // Speed buttons
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.toggle('active', parseFloat(b.dataset.speed) === d.speed));
});

socket.on('reading', (d) => { updateUnit(d); });

socket.on('alert', (a) => { addAlert(a); });

socket.on('scenario_changed', (d) => {
  if (state.units[d.unitId]) state.units[d.unitId].scenario = d.scenario;
  updateScenarioButtons(d.unitId, d.scenario);
});

socket.on('control_changed', (d) => {
  state.running = d.running; state.speed = d.speed;
  updateSimStatus();
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.toggle('active', parseFloat(b.dataset.speed) === d.speed));
});
</script>
</body>
